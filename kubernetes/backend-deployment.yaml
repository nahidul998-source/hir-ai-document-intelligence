apiVersion: apps/v1
kind: Deployment
metadata:
  name: hir-backend
  namespace: hir-production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hir-backend
  template:
    metadata:
      labels:
        app: hir-backend
    spec:
      containers:
      - name: hir-backend
        image: hir/backend:latest
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: hir-backend-secrets
        - configMapRef:
            name: hir-backend-config
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: hir-backend-service
  namespace: hir-production
spec:
  selector:
    app: hir-backend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
