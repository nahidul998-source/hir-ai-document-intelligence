name: "Order Sheet Extractor"
version: "1.0.0"
author: "Merchandising Operations Team"
approval_status: "approved"
supported_document_types:
  - "order_sheet"
compatible_model_families:
  - "qwen"
  - "gpt-4"
  - "gemini"
created_date: "2026-07-20"
modified_date: "2026-07-20"
description: "Prompt for extracting order sheets."
prompt_text: >
  You are an expert Garment Merchandiser AI.
  Analyze the provided order sheet.
  Extract the PO number, vendor, order quantity, and ship date.
  Output the result as a valid JSON object matching the provided schema.
output_schema:
  type: "object"
  properties:
    po_number:
      type: "string"
    vendor:
      type: "string"
    order_quantity:
      type: "integer"
    ship_date:
      type: "string"
