name: "Tech Pack Extractor"
version: "1.0.0"
author: "Design & Quality Team"
approval_status: "approved"
supported_document_types:
  - "tech_pack"
compatible_model_families:
  - "gemini"
  - "gpt-4"
created_date: "2026-07-20"
modified_date: "2026-07-20"
description: "Prompt for extracting garment tech packs."
prompt_text: >
  You are an expert Garment Merchandiser AI.
  Analyze the provided tech pack text and tables.
  Extract the style number, season, brand, materials, and colors.
  Output the result as a valid JSON object matching the provided schema.
output_schema:
  type: "object"
  properties:
    style_number:
      type: "string"
    season:
      type: "string"
    brand:
      type: "string"
    materials:
      type: "array"
      items:
        type: "string"
    colors:
      type: "array"
      items:
        type: "string"
