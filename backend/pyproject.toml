[project]
name = "hir-backend"
version = "0.1.0"
description = "FastAPI Backend for HIR Document Intelligence Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.1",
    "aio-pika>=9.4.0",
    "celery>=5.3.6",
    "redis>=5.0.3",
    "minio>=7.2.5",
    "pyyaml>=6.0.1",
    "asyncpg>=0.29.0",
    "bcrypt==4.0.1",
    "prometheus-client>=0.25.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-exporter-otlp>=1.44.0",
    "email-validator>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0",
]
